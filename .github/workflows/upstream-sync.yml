name: Sync upstream

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream Bluke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/arnav-kr/Bluke.git 2>/dev/null || true
          git fetch --no-tags upstream main

          if ! git merge-base HEAD upstream/main >/dev/null 2>&1; then
            echo "::error::No common history with upstream — they rewrote their history. Rebase the fork onto it locally (see docs/PC-SETUP.md)."
            exit 1
          fi

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "Upstream already merged."
            exit 0
          fi

          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "::error::Upstream conflicts with the rebranded files; resolve locally (see docs/PC-SETUP.md)."
            exit 1
          fi

          git push origin HEAD:refs/heads/sync/upstream --force
          echo "changes=true" >> "$GITHUB_OUTPUT"
          echo "Merged upstream, pushed sync/upstream."

      - name: Open pull request
        if: steps.merge.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --head sync/upstream --json number --jq '.[0].number' || true)
          BODY="Automated merge of arnav-kr/Bluke main. Review the rebranded files before merging: app/build.gradle.kts, strings.xml, BluetoothKeyboardManager.kt, AboutActivity.kt."
          if [ -n "$EXISTING" ]; then
            gh pr comment "$EXISTING" --body "Upstream synced again at $(git rev-parse --short HEAD)."
          else
            gh pr create \
              --base main \
              --head sync/upstream \
              --title "chore: sync upstream Bluke" \
              --body "$BODY"
          fi
