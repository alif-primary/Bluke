name: Windows setup

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - 'setup.cmd'
      - 'build.cmd'
      - '.github/workflows/windows-setup.yml'

permissions:
  contents: read

jobs:
  fresh-sdk:
    name: setup (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # powershell = Windows PowerShell 5.1 (the default on end-user machines)
        # pwsh       = PowerShell 7
        shell: [powershell, pwsh]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show environment
        shell: ${{ matrix.shell }}
        run: |
          $PSVersionTable.PSVersion | Out-String | Write-Host
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          (Get-Command java -ErrorAction SilentlyContinue).Source
          java -version 2>&1 | Write-Host

      - name: Run setup.ps1 against an empty SDK root
        shell: ${{ matrix.shell }}
        run: .\scripts\setup.ps1 -SdkRoot "$env:RUNNER_TEMP\AndroidSdk" -NoBuild

      - name: Build with the freshly installed SDK
        shell: ${{ matrix.shell }}
        run: .\scripts\build.ps1
