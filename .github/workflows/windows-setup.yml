name: Windows setup

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - 'setup.cmd'
      - 'build.cmd'
      - '.github/workflows/windows-setup.yml'

permissions:
  contents: read

jobs:
  fresh-sdk:
    name: setup (${{ matrix.exe }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # powershell = Windows PowerShell 5.1 (what end-user machines default to)
        # pwsh       = PowerShell 7
        exe: [powershell, pwsh]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show environment
        shell: cmd
        run: |
          ${{ matrix.exe }} -NoProfile -Command "$PSVersionTable.PSVersion.ToString(); 'JAVA_HOME=' + $env:JAVA_HOME; (Get-Command java -ErrorAction SilentlyContinue).Source; java -version 2>&1 | Out-String"

      - name: Run setup.ps1 against an empty SDK root
        shell: cmd
        run: ${{ matrix.exe }} -NoProfile -ExecutionPolicy Bypass -File scripts\setup.ps1 -SdkRoot "%RUNNER_TEMP%\AndroidSdk" -NoBuild

      - name: Build with the freshly installed SDK
        shell: cmd
        run: ${{ matrix.exe }} -NoProfile -ExecutionPolicy Bypass -File scripts\build.ps1
